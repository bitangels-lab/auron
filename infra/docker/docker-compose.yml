services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: auron
      POSTGRES_PASSWORD: auron
      POSTGRES_DB: auron
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../../database/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
